[package]
name = "fm-analyzer"
version = "0.3.2"
edition = "2021"
rust-version = "1.80"
description = "FM broadcast analyzer (deviation, pilot, RDS, MPX power, spectra) for RTL-SDR over USB or rtl_tcp"
license = "MIT"
readme = "README.md"
build = "build.rs"
keywords = ["sdr", "rtl-sdr", "fm", "rds", "radio"]
categories = ["multimedia::audio", "science"]

[features]
default = ["usb", "audio"]
# RTL-SDR over USB through librtlsdr, loaded at runtime (nothing linked at build time)
usb = ["dep:libloading"]
# Stereo audio output through the system sound card
audio = ["dep:cpal"]

[dependencies]
eframe = "0.29"
egui_plot = "0.29"
libloading = { version = "0.8", optional = true }
cpal = { version = "0.15", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lib]
name = "fm_analyzer"
path = "src/lib.rs"

[[bin]]
name = "fm-analyzer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# DSP is too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
